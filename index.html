    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-red);
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .subtitle {
            color: var(--accent-gold);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .search-container {
            max-width: 600px;
            margin: 20px auto 30px auto;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--accent-red);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .section-header {
            background: linear-gradient(90deg, #991b1b, #b91c1c);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 30px 0 15px 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }

        .encounter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .encounter-title {
            background-color: #334155;
            padding: 12px 16px;
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-red);
        }

        .pokemon-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .pokemon-card {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #1e293b;
        }

        .sprite-box {
            width: 65px;
            height: 65px;
            background-color: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .sprite-box img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .pokemon-info {
            flex: 1;
        }

        .pokemon-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .level {
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .item-badge {
            display: inline-block;
            background-color: #d97706;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: bold;
        }

        .details-line {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .moves-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 6px;
        }

        .move-tag {
            background-color: #334155;
            color: #cbd5e1;
            font-size: 0.72rem;
            padding: 2px 4px;
            border-radius: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

function renderPage() {
    const container = document.getElementById('content');
    container.innerHTML = '';

    battlesData.forEach(section => {
        const sectionEl = document.createElement('div');
        
        let sectionHTML = `<div class="section-header">📍 ${section.location}</div><div class="grid">`;

        section.encounters.forEach(enc => {
            sectionHTML += `
                <div class="encounter-card">
                    <div class="encounter-title">${enc.trainer}</div>
                    <div class="pokemon-list">
            `;

            enc.pokemon.forEach(p => {
                const spriteUrl = `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${p.id}.png`;
                const itemHTML = p.item !== "No item" ? `<span class="item-badge">🎒 ${p.item}</span>` : '';
                
                let movesHTML = '';
                if(p.moves && p.moves.length > 0) {
                    movesHTML = '<div class="moves-grid">';
                    p.moves.forEach(m => {
                        movesHTML += `<div class="move-tag">${m}</div>`;
                    });
                    movesHTML += '</div>';
                }

                sectionHTML += `
                    <div class="pokemon-card">
                        <div class="sprite-box">
                            <img src="${spriteUrl}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/0.png';">
                        </div>
                        <div class="pokemon-info">
                            <div class="pokemon-name">
                                <span>${p.name}</span>
                                <span class="level">Nv. ${p.lvl}</span>
                            </div>
                            ${itemHTML}
                            <div class="details-line">${p.details}</div>
                            ${movesHTML}
                        </div>
                    </div>
                `;
            });

            sectionHTML += `
                    </div>
                </div>
            `;
        });

        sectionHTML += `</div>`;
        sectionEl.innerHTML = sectionHTML;
        container.appendChild(sectionEl);
    });
}

function filterEncounters() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.encounter-card');

    cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        if(text.includes(query)) {
            card.style.display = "flex";
        } else {
            card.style.display = "none";
        }
    });
}

renderPage();
</script>
